name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch instead of paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nx and pnpm should not phone home or run interactively in CI.
  CI: 'true'
  NX_DAEMON: 'false'
  NX_CLOUD_ACCESS_TOKEN: ''

jobs:
  # Decides which work is worth running. A README-only PR must not start
  # Playwright, so every expensive job hangs off this output.
  affected:
    name: Determine affected projects
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      e2e: ${{ steps.scope.outputs.e2e }}
      render: ${{ steps.scope.outputs.render }}
      capture: ${{ steps.scope.outputs.capture }}
      # Downstream jobs reuse the exact range the affected job resolved,
      # instead of re-deriving it (which breaks on `push`, where base_ref is empty).
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Nx needs the merge base to compute `affected`; a shallow clone
          # silently widens or breaks that range.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: scope
        name: Compute affected range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # A brand-new branch or a force-push can report an all-zero "before".
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
              BASE="HEAD~1"
            fi
          fi

          echo "Affected base=$BASE head=$HEAD"

          # `nx show projects --affected` may print a JSON array (e.g.
          # ["web-studio","state"]) or one project name per line, depending on
          # the Nx output mode. Normalise either shape to a comma-separated
          # list: deleting the newlines instead of turning them into commas
          # would glue adjacent names together ("web-studiodomain...") and
          # silently skip every gate below.
          #
          # A failing Nx must FAIL the job, not read as "nothing affected":
          # swallowing the error would skip every gate on a broken checkout.
          if ! RAW=$(pnpm nx show projects --affected --base="$BASE" --head="$HEAD"); then
            echo "::error::nx could not compute the affected range (base=$BASE head=$HEAD)"
            exit 1
          fi
          echo "Affected projects: ${RAW:-(none)}"

          LIST=$(printf '%s\n' "$RAW" \
            | tr -d '[]" \t' \
            | tr '\n' ',' \
            | tr -s ',' \
            | sed 's/^,//; s/,$//')
          # Comma-wrap so a name can be matched from both ends without the
          # first or last element being missed.
          WRAPPED=",$LIST,"

          # Workspace sync e2e starts apps/api and drives two browser contexts,
          # so API, adapter and port changes must run it too.
          E2E_PROJECTS="web-studio|state|ui|domain|ports|adapters-http|api|mock-services|mock-data|project-hub|video-studio|production-suite"
          # `api` is in the render set because `pnpm export:verify` (5B, AC-10)
          # lives there and drives the real render worker; the render gate is
          # the only job with ffmpeg + Remotion + fonts, so it is where the
          # narrated export is proven.
          RENDER_PROJECTS="domain|render|render-worker|mock-data|api|ports|adapters-http"
          # The DemoPlan drives the shipped UI, so any page, store or contract
          # change can invalidate its assertions. Capture is also the only gate
          # that proves the real-footage → render handoff. `api` is included
          # because `pnpm gate2:verify` (5C) lives there: it drives Gate 2,
          # the browser worker and the render worker through the real server
          # orchestration code, so an API change is exactly what it must cover.
          CAPTURE_PROJECTS="browser-worker|domain|render|render-worker|mock-data|mock-services|state|ui|web-studio|project-hub|video-studio|production-suite|api|ports|adapters-http"

          if printf '%s' "$WRAPPED" | grep -qE ",($E2E_PROJECTS),"; then
            E2E=true
          else
            E2E=false
          fi

          # The golden render only needs the render IR, the composition and the
          # fixture source. A copy-only PR must not download Chromium.
          if printf '%s' "$WRAPPED" | grep -qE ",($RENDER_PROJECTS),"; then
            RENDER=true
          else
            RENDER=false
          fi

          if printf '%s' "$WRAPPED" | grep -qE ",($CAPTURE_PROJECTS),"; then
            CAPTURE=true
          else
            CAPTURE=false
          fi

          # An empty array means nothing changed in a way Nx tracks.
          if [ -z "$LIST" ]; then
            CODE=false
          else
            CODE=true
          fi

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "e2e=$E2E" >> "$GITHUB_OUTPUT"
          echo "render=$RENDER" >> "$GITHUB_OUTPUT"
          echo "capture=$CAPTURE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

  # Lint, typecheck and unit tests. Runs on every PR that touches code.
  validate:
    name: Validate (lint, typecheck, test)
    needs: affected
    if: needs.affected.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 5B narration tests normalize provider output with real ffmpeg/ffprobe
      # (`apps/api/src/speech`). Without them every speech test fails on a bare
      # runner with `spawnSync ffmpeg ENOENT`, so the unit suite installs them
      # just like the render and capture gates do.
      - name: Install ffmpeg
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Lint, typecheck and unit tests (affected only)
        run: >-
          pnpm nx affected -t lint typecheck test
          --base="${{ needs.affected.outputs.base }}"
          --head="${{ needs.affected.outputs.head }}"

      # Proves the layer constraints still reject illegal imports. A normal
      # `lint` stays green if the boundary rule is deleted, so it is checked
      # explicitly by inverting the expected failure.
      - name: Module boundary guard
        run: node scripts/check-boundary-guard.mjs

  build:
    name: Build and bundle budget
    needs: affected
    if: needs.affected.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The budget check runs inside the target; building affected-only would
      # skip the budget on unrelated PRs, so this one is deliberately full.
      - name: Build web-studio (enforces bundle-budget.json)
        run: pnpm nx build web-studio

  # Step 1 Exit Gate: a fixed 30s storyboard must produce a playable MP4 whose
  # ffprobe metadata matches the storyboard, with a SHA256 receipt. This is the
  # only job that proves the render pipeline, so it is never allowed to skip on
  # a render-related change.
  render:
    name: Render golden fixture (MP4 + receipt)
    needs: affected
    if: needs.affected.outputs.render == 'true'
    runs-on: ubuntu-latest
    # First run also downloads Chromium and a ~60 MB CJK font package; the
    # render itself is only a few minutes of this budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The ubuntu-26.04 runner image ships neither ffprobe nor a CJK font.
      # Install ffmpeg explicitly (the worker and verify script both shell out
      # to it) and cache the font package: it is ~60 MB even before apt's
      # overhead, and re-downloading it every run dominated the gate.
      - name: Cache CJK fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: noto-cjk-1:20240730+repack1-1build1

      - name: Install ffmpeg and CJK fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 ffmpeg
          if [ "${{ steps.font-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 fonts-noto-cjk
            mkdir -p "$HOME/.local/share/fonts"
            if [ -d /usr/share/fonts/opentype/noto ]; then
              sudo cp -r /usr/share/fonts/opentype/noto/. "$HOME/.local/share/fonts/"
              sudo chown -R "$USER":"$USER" "$HOME/.local/share/fonts"
            fi
          fi
          fc-cache -f "$HOME/.local/share/fonts"

      # Remotion downloads Chrome Headless Shell on first use. Caching it keeps
      # the gate around the render itself rather than a ~150 MB download.
      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-4.0.545

      - name: Verify ffmpeg and ffprobe are available
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Render 30s fixture
        run: pnpm render:fixture

      - name: Re-verify artifact against manifest and receipt
        run: pnpm verify:render

      # Step 5B / AC-10: real narration (deterministic test voice, honestly
      # labelled), AAC muxing, server SRT and the Gate 3 export bundle. Runs
      # after the golden fixture so a broken silent path fails first and fast.
      - name: Verify narrated export (AC-10)
        run: pnpm export:verify
        env:
          # Absolute so it does not depend on the nx target's cwd (apps/api);
          # the upload step below resolves `dist/audio-verify` from the repo root.
          ASVS_VERIFY_EXPORT_DIR: ${{ github.workspace }}/dist/audio-verify

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: render-golden-30s
          path: |
            dist/render-worker/golden-30s/golden-30s.mp4
            dist/render-worker/golden-30s/manifest.json
            dist/render-worker/golden-30s/receipt.json
          retention-days: 7

      # The narrated MP4 / SRT / manifest live in a temp dir that export:verify
      # deletes; keep the run here so the PR carries inspectable audio evidence.
      - name: Upload narrated export artifact
        uses: actions/upload-artifact@v4
        with:
          name: narration-export-verify
          path: |
            dist/audio-verify/**
          retention-days: 7
          if-no-files-found: warn

  # Step 2 Exit Gate: execute the approved DemoPlan against the production
  # build, require UI assertions (exit code alone is never enough), repeat it
  # for a pass rate, and feed the recorded MP4 back through the Step 1 render.
  capture:
    name: Capture real demo (assertions, pass rate, real-footage render)
    needs: affected
    if: needs.affected.outputs.capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The capture is only usable if Chinese text renders as text, not tofu.
      # Shares the render job's cache so a render-gate run warms this one.
      - name: Cache CJK fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: noto-cjk-1:20240730+repack1-1build1

      - name: Install ffmpeg, CJK fonts, Tesseract and Chromium
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 ffmpeg
          # Step 5D / AC-07: `pnpm qa:verify` proves real OCR (#8 screenshot,
          # #9 clip frame) only when a Tesseract binary exists; otherwise it
          # reports those two as SKIPPED rather than faking a pass.
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 tesseract-ocr
          if [ "${{ steps.font-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 fonts-noto-cjk
            mkdir -p "$HOME/.local/share/fonts"
            if [ -d /usr/share/fonts/opentype/noto ]; then
              sudo cp -r /usr/share/fonts/opentype/noto/. "$HOME/.local/share/fonts/"
              sudo chown -R "$USER":"$USER" "$HOME/.local/share/fonts"
            fi
          fi
          fc-cache -f "$HOME/.local/share/fonts"
          pnpm exec playwright install --with-deps chromium

      # `pnpm render:captured` uses Remotion's Chrome Headless Shell; share the
      # same cache key as the render job to avoid re-downloading ~150 MB.
      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-4.0.545

      - name: Verify ffmpeg, ffprobe and tesseract are available
        run: |
          ffmpeg -version
          ffprobe -version
          tesseract --version

      # The capture worker serves this build with `vite preview`; a dev server
      # would show compiled-on-demand loading screens inside the recording.
      - name: Build web-studio (capture target)
        run: pnpm nx build web-studio

      - name: Capture approved DemoPlan (assertion-first)
        run: pnpm capture:demo

      - name: Verify capture receipt, hashes and media metadata
        run: pnpm verify:capture

      # docs/08 §9 case 2: an out-of-allowlist plan must fail before any request.
      - name: Allowlist safety probe
        run: pnpm capture:safety

      - name: Repeat capture (3 runs, pass rate ≥ 80%)
        run: pnpm capture:repeat

      - name: Render the captured clip through the Step 1 pipeline
        run: pnpm render:captured

      - name: Verify rendered MP4, receipt and real-media hashes
        run: pnpm verify:render:captured

      # Step 5D / WP-16 / AC-07: independent QA + privacy gate. Real ffmpeg
      # media, a real trace.zip, real PNG tEXt secrets, server-side redacted
      # evidence frames — and real Tesseract OCR, installed above, so #8/#9 are
      # proven here instead of skipped. Run it *before* Gate 2 so a privacy
      # regression fails this job with the narrower evidence.
      - name: Verify independent QA and privacy gate (5D)
        run: pnpm qa:verify
        env:
          ASVS_VERIFY_EXPORT_DIR: ${{ github.workspace }}/dist/qa-verify

      # Step 5C / WP-14: Gate 2 through the real server orchestration — planner,
      # approval binding, API restart, both tamper layers, real Chromium capture
      # of the build above, backfill, narration, SRT and a real Remotion render.
      # api/src is inside the CAPTURE_PROJECTS set, so an API change runs it.
      - name: Verify Gate 2 capture orchestration (5C)
        run: pnpm gate2:verify
        env:
          # Absolute so the upload step resolves it from the repo root, not the
          # nx target's cwd (apps/api).
          ASVS_VERIFY_CAPTURE_DIR: ${{ github.workspace }}/dist/gate2-verify

      - name: Upload capture and render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-evidence
          path: |
            dist/browser-worker/web-studio-tour/web-studio-tour.mp4
            dist/browser-worker/web-studio-tour/capture-receipt.json
            dist/browser-worker/web-studio-tour/captured-30s.json
            dist/browser-worker/web-studio-tour/screenshots
            dist/browser-worker/web-studio-tour/trace.zip
            dist/browser-worker/web-studio-tour/failure-report.json
            dist/browser-worker/repeat/**/repeat-report.json
            dist/browser-worker/repeat/**/run-*/capture-receipt.json
            dist/browser-worker/repeat/**/run-*/failure-report.json
            dist/browser-worker/safety-blocked-origin/safety-report.json
            dist/render-worker/captured-30s/captured-30s.mp4
            dist/render-worker/captured-30s/manifest.json
            dist/render-worker/captured-30s/receipt.json
            dist/gate2-verify/**
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: E2E (Playwright, desktop + tablet + mobile)
    needs: affected
    if: needs.affected.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # E2E is the slowest job; cap it so a hung browser cannot burn the budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The Gate 2 capture spec approves a real run, and `synthesize_voice`
      # shells out to ffmpeg to normalize every narration clip — without it the
      # run fails at step 6 with `spawnSync ffmpeg ENOENT` and the "clip was
      # backfilled" assertion never gets a chance to pass. Same reason the
      # validate job installs it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 ffmpeg
          ffmpeg -version

      - name: Run Playwright
        run: pnpm test:e2e

      # Verified by forcing a failure: Playwright puts screenshots and traces in
      # apps/web-studio/test-results (the config's parent dir), not next to the
      # config. There is no HTML report — the reporter is `list` only.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/web-studio/test-results
          retention-days: 7
          if-no-files-found: warn

  # Single required status check. Without this, skipping `e2e` on a docs-only
  # PR would leave branch protection waiting forever on a check that never ran.
  ci:
    name: CI
    if: always()
    needs: [affected, validate, build, render, capture, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          echo "affected=${{ needs.affected.result }}"
          echo "validate=${{ needs.validate.result }}"
          echo "build=${{ needs.build.result }}"
          echo "render=${{ needs.render.result }}"
          echo "capture=${{ needs.capture.result }}"
          echo "e2e=${{ needs.e2e.result }}"

          if [ "${{ needs.affected.result }}" != "success" ]; then
            echo "::error::affected job did not succeed"
            exit 1
          fi

          # `skipped` is a valid outcome only when the affected job decided the
          # work was unnecessary. Anything else is a failure. Each result is
          # referenced explicitly: `needs[expr]` is not valid Actions syntax.
          check() {
            if [ "$2" != "success" ] && [ "$2" != "skipped" ]; then
              echo "::error::$1 finished as $2"
              exit 1
            fi
          }
          check validate "${{ needs.validate.result }}"
          check build "${{ needs.build.result }}"
          check render "${{ needs.render.result }}"
          check capture "${{ needs.capture.result }}"
          check e2e "${{ needs.e2e.result }}"

          echo "All required jobs passed or were intentionally skipped."
